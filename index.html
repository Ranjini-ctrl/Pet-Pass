<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetPass – By PetOLife</title>
  <link rel="stylesheet" href="css/loading.css" />
</head>
<body>
  <!-- Loading Screen -->
  <div class="loader-wrapper" id="loader">
    <div class="loader-content">
      <div class="logo-float">
        <img src="logo.jpeg" alt="PetPass Logo" class="loader-logo" />
      </div>
      <h1 class="loader-title">PetPass</h1>
      <p class="loader-sub">By PetOLife</p>
      <p class="loader-credit">Made by Ranjini</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    // Redirect to signup after 5 seconds
    setTimeout(() => {
      const loader = document.getElementById('loader');
      loader.style.opacity = '0';
      loader.style.transition = 'opacity 0.6s ease';
      setTimeout(() => {
        window.location.href = 'signup.html';
      }, 600);
    }, 5000);
  </script>
</body>
</html>
